MACOSX_DEPLOYMENT_TARGET:
  - '11.0'  # [osx]

cdt_name:
  - cos6  # [linux]

channel_sources:
  - conda-forge

cxx_compiler:
  - gxx      # [linux]
  - clangxx  # [osx]

cxx_compiler_version:
  - '12'  # [linux]
  # libc++ >= 20 provides std::from_chars for floating-point types;
  # 21 is the current conda-forge default compiler stack
  - '21'  # [osx]

# the following pinnings are necessary to allow switching the BLAS/LAPACK
# implementation as runtime, thus replicating the behavior of conda-forge
# packages documented here:
# https://conda-forge.org/docs/maintainer/knowledge_base.html#how-it-works

#libcblas:
#  - 3.9 *netlib

#liblapacke:
#  - 3.9 *netlib

llvm_openmp:
  - '21'  # [osx]
  - '18'  # [win]

macos_machine:
  - arm64-apple-darwin20.0.0   # [osx and arm64]
  - x86_64-apple-darwin13.4.0  # [osx and x86_64]

#mpi:
#  - msmpi    # [win]
#  - mpich    # [not win]
#  - openmpi  # [not win]

python:
  - '3.12'  # EOL: Oct 2028
  - '3.13'  # EOL: Oct 2029

target_platform:
  - linux-64  # [linux]
  - win-64    # [win]
  - osx-arm64  # [osx and arm64]
  - osx-64     # [osx and x86_64]

CONDA_BUILD_SYSROOT:
  - /Users/runner/MacOSX11.0.sdk  # [osx]
